name: CRM auto-reply worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    # Two sequential 130s-capped calls can take up to ~4.3 minutes combined; give real headroom
    # rather than the single-call budget, so a slow first call can't truncate the second.
    timeout-minutes: 6
    steps:
      - name: Poll the CRM auto-reply worker endpoint
        env:
          CRM_WORKER_SECRET: ${{ secrets.CRM_WORKER_SECRET }}
          CRM_WORKER_BASE_URL: ${{ secrets.CRM_WORKER_BASE_URL }}
        run: |
          curl -sS -X POST "$CRM_WORKER_BASE_URL/api/internal/crm/auto-replies" \
            -H "Authorization: Bearer $CRM_WORKER_SECRET" \
            --max-time 130 \
            --fail-with-body
      # Runs even if the auto-reply step above failed or timed out, so one queue's outage
      # never silently stops the other queue from being polled.
      - name: Poll the CRM follow-up worker endpoint
        if: always()
        env:
          CRM_WORKER_SECRET: ${{ secrets.CRM_WORKER_SECRET }}
          CRM_WORKER_BASE_URL: ${{ secrets.CRM_WORKER_BASE_URL }}
        run: |
          curl -sS -X POST "$CRM_WORKER_BASE_URL/api/internal/crm/follow-ups" \
            -H "Authorization: Bearer $CRM_WORKER_SECRET" \
            --max-time 130 \
            --fail-with-body
